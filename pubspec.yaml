name: app_filmes
description: "Filmes populares do TMDB, com trailer e informações de cada filme."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.11.0
  retrofit: ^4.10.0
  json_annotation: ^4.12.0
  pretty_dio_logger: ^1.4.0
  flutter_dotenv: ^6.0.1
  youtube_player_iframe: ^6.0.2
  url_launcher: ^6.3.2
  lucide_icons_flutter: ^3.1.24
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.5.6
  sqflite: ^2.4.5
  sqflite_common_ffi_web: ^1.2.0
  path: ^1.9.1
  supabase_flutter: ^2.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  retrofit_generator: ^10.2.9
  json_serializable: ^6.14.1
  sqflite_common_ffi: ^2.4.5

flutter:
  uses-material-design: true
  generate: true

  assets:
    - .env
    - assets/fonts/OFL.txt

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
