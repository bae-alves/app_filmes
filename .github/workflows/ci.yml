name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/flutter-setup
      - name: Formatação
        run: dart format --output=none --set-exit-if-changed .
      - name: Análise estática
        run: flutter analyze

  test:
    name: Testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/flutter-setup
      - name: Testes de unidade e de widget
        run: flutter test

  build-web:
    name: Build web
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/flutter-setup
      - run: flutter build web --release
      - uses: actions/upload-artifact@v7
        with:
          name: web
          path: build/web
          # O .env do bundle (assets/.env) é um arquivo oculto; sem isto ele
          # fica fora do artefato e o app não abre no smoke.
          include-hidden-files: true
          retention-days: 7

  build-android:
    name: Build Android
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: ./.github/actions/flutter-setup
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v7
        with:
          name: apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

  smoke-web:
    name: Smoke web
    needs: build-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: web
          path: build/web
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: npm ci --prefix tool/smoke
      - name: Abrir e fechar no Chrome
        run: node tool/smoke/web_smoke.mjs build/web

  smoke-android:
    name: Smoke Android
    needs: build-android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: apk
          path: build/apk
      - name: Liberar o KVM para o emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Abrir e fechar no emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash tool/smoke/android_smoke.sh build/apk/app-release.apk
